<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Ilustrasi suasana kedai kopi Rajahemat">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3EDE2"/>
      <stop offset="100%" stop-color="#EADCC8"/>
    </linearGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8C4518" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#8C4518" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>

  <!-- Jendela pagi -->
  <rect x="120" y="120" width="380" height="380" rx="18" fill="#FFFDF9" stroke="#CBBBA9" stroke-width="8"/>
  <line x1="310" y1="120" x2="310" y2="500" stroke="#CBBBA9" stroke-width="6"/>
  <line x1="120" y1="310" x2="500" y2="310" stroke="#CBBBA9" stroke-width="6"/>
  <circle cx="205" cy="205" r="42" fill="#FFEDD5"/>

  <!-- Rak biji kopi -->
  <rect x="700" y="150" width="380" height="14" rx="7" fill="#CBBBA9"/>
  <rect x="730" y="70" width="66" height="80" rx="10" fill="#3A2116"/>
  <rect x="812" y="70" width="66" height="80" rx="10" fill="#58290D"/>
  <rect x="894" y="70" width="66" height="80" rx="10" fill="#703511"/>
  <rect x="976" y="70" width="66" height="80" rx="10" fill="#8C4518"/>

  <!-- Meja bar -->
  <rect x="80" y="640" width="1040" height="34" rx="17" fill="#8C4518"/>
  <rect x="140" y="674" width="26" height="150" fill="#703511"/>
  <rect x="1034" y="674" width="26" height="150" fill="#703511"/>

  <!-- Cangkir utama -->
  <ellipse cx="470" cy="628" rx="120" ry="26" fill="#3A2116" opacity=".12"/>
  <path d="M370 500h200v92a100 100 0 0 1-100 100 100 100 0 0 1-100-100z" fill="#FFFFFF" stroke="#CBBBA9" stroke-width="6"/>
  <path d="M570 520h34a46 46 0 0 1 0 92h-34" fill="none" stroke="#CBBBA9" stroke-width="10"/>
  <ellipse cx="470" cy="512" rx="100" ry="20" fill="#3A2116"/>
  <ellipse cx="470" cy="512" rx="78" ry="13" fill="#58290D"/>

  <!-- Uap -->
  <path d="M430 470c0-34 26-34 26-68s-26-34-26-68" fill="none" stroke="url(#steam)" stroke-width="12" stroke-linecap="round"/>
  <path d="M490 470c0-40 28-40 28-80s-28-40-28-80" fill="none" stroke="url(#steam)" stroke-width="12" stroke-linecap="round"/>

  <!-- Saucer + sendok -->
  <ellipse cx="470" cy="700" rx="170" ry="30" fill="#FFFFFF" stroke="#CBBBA9" stroke-width="6"/>
  <ellipse cx="470" cy="698" rx="120" ry="18" fill="#F3EDE2"/>

  <!-- Tanaman -->
  <rect x="820" y="560" width="96" height="88" rx="12" fill="#8C4518"/>
  <path d="M868 560c-46-18-58-76-30-116 34 4 62 44 60 88z" fill="#166534" opacity=".8"/>
  <path d="M868 560c44-24 50-84 18-120-34 8-58 52-52 96z" fill="#166534" opacity=".55"/>

  <!-- Lampu gantung -->
  <line x1="760" y1="0" x2="760" y2="180" stroke="#635345" stroke-width="6"/>
  <path d="M700 180h120l-26 66h-68z" fill="#3A2116"/>
  <circle cx="760" cy="258" r="16" fill="#FFEDD5"/>
</svg>
