<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Ilustrasi interior kedai dengan kursi dan meja">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EFE6D9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#room)"/>

  <!-- Dinding panel kayu -->
  <g stroke="#E5DCD0" stroke-width="4">
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="150" y1="240" x2="150" y2="560"/>
    <line x1="300" y1="240" x2="300" y2="560"/>
    <line x1="450" y1="240" x2="450" y2="560"/>
    <line x1="600" y1="240" x2="600" y2="560"/>
    <line x1="750" y1="240" x2="750" y2="560"/>
    <line x1="900" y1="240" x2="900" y2="560"/>
    <line x1="1050" y1="240" x2="1050" y2="560"/>
  </g>

  <!-- Lantai -->
  <rect y="560" width="1200" height="340" fill="#EADCC8"/>
  <g stroke="#D8C8B2" stroke-width="4">
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
    <line x1="0" y1="800" x2="1200" y2="800"/>
  </g>

  <!-- Meja bundar kiri -->
  <ellipse cx="300" cy="676" rx="170" ry="34" fill="#FFFFFF" stroke="#CBBBA9" stroke-width="6"/>
  <rect x="286" y="676" width="28" height="150" fill="#703511"/>
  <path d="M230 800h140" stroke="#703511" stroke-width="18" stroke-linecap="round"/>

  <!-- Cangkir di meja kiri -->
  <path d="M262 606h64v34a32 32 0 0 1-64 0z" fill="#FFFFFF" stroke="#CBBBA9" stroke-width="5"/>
  <ellipse cx="294" cy="608" rx="32" ry="8" fill="#3A2116"/>
  <circle cx="294" cy="608" r="40" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <ellipse cx="294" cy="646" rx="52" ry="12" fill="#F3EDE2" stroke="#CBBBA9" stroke-width="4"/>

  <!-- Kursi kiri -->
  <path d="M96 700h96v-96a16 16 0 0 1 16-16h100a16 16 0 0 1 16 16v96" fill="none" stroke="#8C4518" stroke-width="14" stroke-linecap="round"/>
  <rect x="96" y="700" width="228" height="26" rx="13" fill="#8C4518"/>

  <!-- Meja bundar kanan -->
  <ellipse cx="880" cy="700" rx="190" ry="38" fill="#FFFFFF" stroke="#CBBBA9" stroke-width="6"/>
  <rect x="866" y="700" width="28" height="140" fill="#703511"/>
  <path d="M806 806h148" stroke="#703511" stroke-width="18" stroke-linecap="round"/>

  <!-- Buku + laptop -->
  <rect x="790" y="640" width="90" height="56" rx="8" fill="#58290D"/>
  <rect x="898" y="626" width="130" height="78" rx="10" fill="#3A2116"/>
  <rect x="908" y="636" width="110" height="58" rx="6" fill="#F3EDE2"/>

  <!-- Kursi kanan -->
  <path d="M690 720h96v-96a16 16 0 0 1 16-16h100a16 16 0 0 1 16 16v96" fill="none" stroke="#8C4518" stroke-width="14" stroke-linecap="round"/>
  <rect x="690" y="720" width="228" height="26" rx="13" fill="#8C4518"/>

  <!-- Lampu gantung -->
  <line x1="600" y1="0" x2="600" y2="150" stroke="#635345" stroke-width="6"/>
  <path d="M520 150h160l-34 84h-92z" fill="#3A2116"/>
  <circle cx="600" cy="248" r="20" fill="#FFEDD5"/>
  <circle cx="600" cy="248" r="60" fill="#FFEDD5" opacity=".25"/>

  <!-- Tanaman pojok -->
  <rect x="1090" y="430" width="80" height="130" rx="10" fill="#8C4518"/>
  <path d="M1130 430c-40-16-52-70-26-104 30 4 54 40 52 80z" fill="#166534" opacity=".75"/>
  <path d="M1130 430c40-22 46-76 16-108-30 8-50 46-46 86z" fill="#166534" opacity=".5"/>
</svg>
