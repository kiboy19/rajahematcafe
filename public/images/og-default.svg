<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Rajahemat Coffee and Eatery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A2116"/>
      <stop offset="100%" stop-color="#241810"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Border aksen -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#8C4518" stroke-width="2" stroke-opacity=".4"/>

  <!-- Logo R -->
  <circle cx="160" cy="180" r="64" fill="#8C4518"/>
  <text x="160" y="206" fill="#FFF9F2" font-family="'Playfair Display', Georgia, serif" font-size="76" font-weight="bold" text-anchor="middle">R</text>

  <!-- Judul brand -->
  <text x="260" y="174" fill="#FFF9F2" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="bold">Rajahemat</text>
  <text x="264" y="214" fill="#CBBBA9" font-family="'Karla', sans-serif" font-size="20" font-weight="600" letter-spacing="4">COFFEE &amp; EATERY</text>

  <!-- Tagline besar -->
  <text x="100" y="360" fill="#FFF9F2" font-family="'Playfair Display', Georgia, serif" font-size="68" font-weight="bold">Ngopi hemat, rasa nikmat.</text>
  <text x="100" y="420" fill="#E5DCD0" font-family="'Karla', sans-serif" font-size="26">Biji lokal diseduh segar setiap hari di lereng pegunungan.</text>

  <!-- Tag fitur -->
  <g transform="translate(100, 470)">
    <rect width="180" height="48" rx="24" fill="#58290D"/>
    <text x="90" y="31" fill="#FFF9F2" font-family="'Karla', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Kopi Lokal</text>

    <rect x="196" width="200" height="48" rx="24" fill="#58290D"/>
    <text x="296" y="31" fill="#FFF9F2" font-family="'Karla', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Dapur Sendiri</text>

    <rect x="412" width="210" height="48" rx="24" fill="#58290D"/>
    <text x="517" y="31" fill="#FFF9F2" font-family="'Karla', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Pesan dari Meja</text>
  </g>
</svg>
